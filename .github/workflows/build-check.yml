name: Build, Test & Lint Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Lint + TS tests + Python tests + proof + build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Check lockfile for internal registry URLs
        run: |
          if grep -Eq "npm\\.apple\\.com|artifacts\\.apple\\.com" package-lock.json; then
            echo "ERROR: package-lock.json contains internal Apple registry URLs — Vercel can't install these."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Install Python dependencies
        run: pip install -r requirements.txt pytest

      - name: Lint
        run: npm run lint

      - name: TypeScript tests
        run: npm test

      - name: Python tests
        run: npm run test:py

      - name: Proof run (Iris email scenarios)
        run: npm run proof

      - name: Fail if recorded proof output is stale
        run: git diff --exit-code -- docs/proof/iris-email-scenarios.md

      - name: Build
        run: npm run build
